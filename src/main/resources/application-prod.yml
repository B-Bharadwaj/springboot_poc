# Prod profile: quiet logs; secrets come from env vars.
spring:
  jpa:
    # Never print SQL in production.
    show-sql: false

springdoc:
  api-docs:
    # Hide the OpenAPI JSON in production.
    enabled: false
  swagger-ui:
    # Hide the Swagger UI page in production.
    enabled: false

logging:
  level:
    # Libraries log warnings and errors only.
    root: WARN
    # Our code logs info, e.g. placed orders.
    com.example.order_poc: INFO
