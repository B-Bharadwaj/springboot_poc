# Spring Boot settings, same for every profile.
spring:
  # dev adds SQL/debug logs; local holds the real login.
  profiles:
    active: dev,local
  application:
    # Name shown in every log line.
    name: order-poc
  datasource:
    # PostgreSQL database orderdb on this machine.
    url: jdbc:postgresql://localhost:5432/orderdb
    # Login comes from env vars or application-local.yml.
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    # Close the DB session before JSON is written.
    open-in-view: false
    hibernate:
      # Only check tables match entities; Flyway creates them.
      ddl-auto: validate
    properties:
      hibernate:
        # Load lazy data for up to 10 parents per query.
        default_batch_fetch_size: 10

# Custom settings, bound to AppProperties.
app:
  greeting: "Hello from the service"

server:
  # Port 8080 is taken on this machine; keep 8081.
  port: 8081
